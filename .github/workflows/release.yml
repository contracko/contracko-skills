name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check unified public version against release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_versions.py --tag "$RELEASE_TAG"
      - name: Validate tool contracts and packaged links
        run: python3 -m unittest discover -s tests -v
      - name: Build deterministic release archives
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./build-zips.sh
      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip
          generate_release_notes: true

  npm:
    runs-on: ubuntu-latest
    needs: zips
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
      - name: Stage @contracko/mcp
        working-directory: packages/mcp
        run: |
          npm ci
          npm stage publish --access public
