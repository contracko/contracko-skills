name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one zip per skill
        run: ./build-zips.sh
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
