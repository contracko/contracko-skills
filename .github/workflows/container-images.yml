name: Immutable container images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container-images:
    name: Immutable container images
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: contracko/agent-scripts/.github/actions/container-images@b350297fcdf6a0e309b9d993685aad7f259eba11
