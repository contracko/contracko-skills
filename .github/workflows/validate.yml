name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check canonical Agent Plugins directory package
        run: python3 scripts/build_release_artifacts.py --check-directory
      - name: Check released tool contracts and packaged skill links
        run: python3 -m unittest discover -s tests -v
