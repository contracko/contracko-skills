name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unified public version
        run: python3 scripts/check_versions.py
      - name: Check complete skill tree parity and generated Agent Plugins package
        run: python3 scripts/build_release_artifacts.py --check-directory
      - name: Check released tool contracts and packaged skill links
        run: python3 -m unittest discover -s tests -v

  chatgpt-package:
    name: ChatGPT package
    needs: skills
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build deterministic release archives
        run: bash build-zips.sh
      - name: Record ChatGPT archive digest
        run: sha256sum dist/contracko-agent-plugin-chatgpt.zip >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ChatGPT candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contracko-chatgpt-plugin-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/contracko-agent-plugin-chatgpt.zip
          if-no-files-found: error
          retention-days: 14
